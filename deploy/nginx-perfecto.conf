# nginx для «Перфекто»: отдаёт сайт и проксирует заявки на бэкенд.
# Ставится скриптом setup.sh в /etc/nginx/sites-available/perfecto
# __DOMAIN__ подставляется автоматически (или '_' , если домена ещё нет).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/perfecto;
    index index.html;

    # ── размер и таймауты ────────────────────────────────────────────────
    client_max_body_size 2m;

    # ── сжатие ───────────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff font/woff2;

    # ── базовые заголовки безопасности ───────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── заявки с форм → бэкенд (127.0.0.1:8787) ──────────────────────────
    location = /lead {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    # проверка живости бэкенда: curl https://домен/health → ok
    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    # просмотр заявок (защищено ключом ADMIN_KEY в .env бэкенда)
    location = /leads {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    # ── статика сайта ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # кэш картинок, шрифтов, PDF-гида
    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|css|js|woff|woff2|pdf)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML не кэшируем — правки должны появляться сразу
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # свои страницы ошибок
    error_page 404 /404.html;

    # закрываем служебное на всякий случай
    location ~ /\.(git|env) { deny all; return 404; }
}
